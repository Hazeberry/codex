name: Gefangenendeckel kontrollierte Fortsetzungen
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deckel-fortsetzungen
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node tests/deckel-fortsetzungen.js
      - id: plan
        run: |
          mkdir -p vorbereitung
          node auswertung/diagnose/deckel-startstellungen.js > vorbereitung/startstellungen.json
          echo "matrix=$(python3 auswertung/diagnose/deckel-fortsetzungen.py plan vorbereitung/startstellungen.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: deckel-plan
          path: vorbereitung/
          retention-days: 90
  spielen:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: deckel-plan
          path: vorbereitung/
      - name: GNU Go installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnugo
      - name: Genau eine freie Fortsetzung
        timeout-minutes: 27
        run: python3 auswertung/diagnose/deckel-fortsetzungen.py run vorbereitung/startstellungen.json '${{ matrix.id }}' 'ergebnisse/${{ matrix.id }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deckel-fortsetzung-${{ matrix.id }}
          path: ergebnisse/
          retention-days: 90
          if-no-files-found: error
  bericht:
    needs: [plan, spielen]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: deckel-plan
          path: vorbereitung/
      - uses: actions/download-artifact@v7
        with:
          pattern: deckel-fortsetzung-*
          path: roh/
          merge-multiple: true
      - name: Vollständigkeit und gepaarte Ergebnisse
        run: |
          set -euo pipefail
          python3 auswertung/diagnose/deckel-fortsetzungen.py report vorbereitung/startstellungen.json roh | tee bericht.txt
          cat bericht.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deckel-fortsetzungen-gesamt
          path: |
            vorbereitung/
            roh/
            bericht.txt
          retention-days: 90
          if-no-files-found: error
