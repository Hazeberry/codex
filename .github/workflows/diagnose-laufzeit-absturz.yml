name: Diagnose Laufzeit und Absturz

# Go in der Sitzung vom 05.11.2026: Untersuchung der langen Fuego-Partien und GNU-Go-127.
# Nur historischer Stand und sechs fest ausgewählte Reproduktionen, keine Spieländerung.
on:
  workflow_dispatch:
    inputs:
      fortsetzen_aus:
        description: 'Vorlauf mit bestandenen Fällen und unverändertem Diagnosecode (leer = alle sechs neu)'
        required: false
        default: ''
      nur_bericht:
        description: 'Nur gesicherte Ergebnisse prüfen; bei fehlendem Fall abbrechen, keine Partie starten'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-laufzeit-absturz
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      replay: ${{ steps.plan.outputs.replay }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node tests/diagnose-laufzeit-absturz.js
      - uses: actions/download-artifact@v7
        if: inputs.fortsetzen_aus != ''
        with:
          pattern: diagnose-*
          path: vorlauf/
          run-id: ${{ inputs.fortsetzen_aus }}
          github-token: ${{ github.token }}
      - id: plan
        env:
          VORLAUF: ${{ inputs.fortsetzen_aus }}
          NUR_BERICHT: ${{ inputs.nur_bericht }}
        run: |
          python3 auswertung/diagnose/laufzeit-absturz.py plan ergebnisse > matrix.json
          if [ -n "$VORLAUF" ]; then
            python3 auswertung/diagnose/laufzeit-fortsetzen.py vorlauf ergebnisse "$VORLAUF" > matrix.json
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          path = Path('matrix.json')
          matrix = json.loads(path.read_text())
          missing = bool(matrix['include'])
          if missing and os.environ['NUR_BERICHT'] == 'true':
              raise SystemExit('KEIN URTEIL: Pflichtfälle fehlen; nur_bericht startet keine Partien')
          print('replay=' + ('true' if missing else 'false'))
          if not missing:
              path.write_text(json.dumps({'include': [{'id': 'nicht-gestartet', 'gegner': 'g'}]}))
          PY
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > ergebnisse/quellen-sha.txt
      - uses: actions/upload-artifact@v7
        with:
          name: diagnose-plan
          path: ergebnisse/
          retention-days: 90

  fuego:
    needs: plan
    if: needs.plan.outputs.replay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        if: inputs.fortsetzen_aus != ''
        with:
          name: diagnose-fuego
          path: fuego-bin/
          run-id: ${{ inputs.fortsetzen_aus }}
          github-token: ${{ github.token }}
      - if: inputs.fortsetzen_aus == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool subversion libboost-all-dev
          bash auswertung/fuego/bauen.sh svn gnu++14 fuego-bin
          sha256sum fuego-bin/fuego > fuego-bin/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: diagnose-fuego
          path: fuego-bin/
          retention-days: 90

  replay:
    needs: [plan, fuego]
    if: needs.plan.outputs.replay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: diagnose-plan
          path: ergebnisse/
      - uses: actions/download-artifact@v7
        with:
          name: diagnose-fuego
          path: fuego-bin/
      - name: Nur benötigte Programme installieren (begrenzt)
        timeout-minutes: 6
        env:
          GEGNER: ${{ matrix.gegner }}
          FALL: ${{ matrix.id }}
        run: |
          sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          pakete=(gnugo)
          if [ "$GEGNER" = f ]; then
            pakete+=(libboost-filesystem-dev libboost-thread-dev libboost-program-options-dev libboost-system-dev)
          fi
          if [ "$FALL" = g-A-127 ]; then pakete+=(gdb); fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y -qq "${pakete[@]}"
      - name: Historischen Stand vorbereiten und Versionen sichern
        timeout-minutes: 2
        run: |
          chmod +x fuego-bin/fuego
          mkdir historisch
          git archive 8740574aa6f3d572b1d234d58202008d71404fb2 | tar -x -C historisch
          mkdir -p "ergebnisse/${{ matrix.id }}"
          /usr/games/gnugo --version > "ergebnisse/${{ matrix.id }}/gnugo-version.txt"
          uname -a > "ergebnisse/${{ matrix.id }}/system.txt"
          node --version >> "ergebnisse/${{ matrix.id }}/system.txt"
          cp fuego-bin/sha256.txt "ergebnisse/${{ matrix.id }}/fuego-sha256.txt"
      - name: Eine Partie reproduzieren und Zeiten erfassen
        timeout-minutes: 33
        run: python3 auswertung/diagnose/laufzeit-absturz.py replay ergebnisse '${{ matrix.id }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnose-${{ matrix.id }}
          path: ergebnisse/${{ matrix.id }}/
          retention-days: 90
          if-no-files-found: error

  bericht:
    needs: [plan, replay]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: diagnose-*
          path: artefakte/
      - name: Bericht
        run: |
          mkdir -p ergebnisse
          cp -r artefakte/diagnose-plan/* ergebnisse/
          for dir in artefakte/diagnose-[gf]-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            cp -r "$dir" "ergebnisse/${name#diagnose-}"
          done
          status=0
          python3 auswertung/diagnose/laufzeit-absturz.py report ergebnisse || status=$?
          cat ergebnisse/bericht.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnose-gesamt-${{ github.run_attempt }}
          path: ergebnisse/
          retention-days: 90
